[package]
name = "protocol"
version = "0.99.0"
edition = "2024"
description = "Injects the Coderpack agent into Sacred Gold and runs the mod JVM"

[dependencies]
anyhow = "1"
# Patched copy -- see vendor/README.md. Upstream 0.17.2 faults on
# the first non-RPC message from the agent.
frida = { path = "vendor/frida", features = ["auto-download"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
